# Voice stack — reuses local-voice-ai Docker services (Whisper, Kokoro, LiveKit, Ollama optional)
# Run: ./scripts/up-with-voice.sh

services:
  habits-api:
    build:
      context: ./server
    ports:
      - "${HABITS_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_PUBLIC_URL=${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
    volumes:
      - habits-data:/app/.habits
    depends_on:
      livekit:
        condition: service_started
    restart: unless-stopped
    networks:
      - agent_network

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    command: --dev --bind "0.0.0.0"
    networks:
      - agent_network

  kokoro:
    build:
      context: ../local-voice-ai/inference/kokoro
    ports:
      - "8880:8880"
    networks:
      - agent_network

  whisper:
    build:
      context: ../local-voice-ai/inference/whisper
    volumes:
      - whisper-data:/data
    environment:
      - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-Systran/faster-whisper-small}
      - VOXBOX_DEVICE=${VOXBOX_DEVICE:-cpu}
      - DATA_DIR=/data
      - HF_HUB_DISABLE_XET=1
      - HF_HUB_INSECURE=${HF_HUB_INSECURE:-1}
    ports:
      - "11437:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 15s
      retries: 60
      start_period: 180s
    networks:
      - agent_network

  livekit_agent:
    build:
      context: ./livekit_agent
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - HABITS_API_URL=http://habits-api:8787
      - HABITS_INTERNAL_BEARER=${HABITS_INTERNAL_BEARER:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-M2.7}
      - STT_PROVIDER=whisper
      - STT_BASE_URL=http://whisper:80/v1
      - STT_MODEL=${STT_MODEL:-Systran/faster-whisper-small}
      - TTS_BASE_URL=http://kokoro:8880/v1
      - TTS_MODEL=kokoro
      - TTS_VOICE=af_nova
    depends_on:
      livekit:
        condition: service_started
      kokoro:
        condition: service_started
      whisper:
        condition: service_healthy
      habits-api:
        condition: service_started
    networks:
      - agent_network

volumes:
  habits-data:
  whisper-data:

networks:
  agent_network:
    driver: bridge
