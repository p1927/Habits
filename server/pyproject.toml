[project]
name = "habits-api"
version = "0.1.0"
description = "Habits PWA backend — Google Sheets, MiniMax agent, voice orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.0",
  "google-api-python-client>=2.150.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.9",
  "livekit-api>=0.8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
habits-api = "habits_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["habits_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
