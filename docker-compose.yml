# API-only compose. For voice, run: ./scripts/up-with-voice.sh
# (starts ../local-voice-ai Docker stack + habits-api)
services:
  habits-api:
    build:
      context: ./server
    ports:
      - "${HABITS_PORT:-8787}:8787"
    env_file:
      - .env
    volumes:
      - habits-data:/app/.habits
    restart: unless-stopped

volumes:
  habits-data:
